<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selection Clean Copy 設定</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-area">
        <span class="logo-icon">📋</span>
        <div>
          <h1 class="title">Selection Clean Copy</h1>
          <p class="subtitle">Firefox 拡張機能 - 行番号削除</p>
        </div>
      </div>
      <span class="badge">v1.1.0</span>
    </header>

    <div class="shortcut-banner">
      <span class="key-tag">Alt</span> + <span class="key-tag">C</span>
      <span class="shortcut-desc">でも直接クリーンコピー可能</span>
    </div>

    <!-- 現在のサイト有効化カード -->
    <div id="domainCard" class="domain-card">
      <div class="domain-card-header">
        <div class="domain-card-info">
          <span class="domain-card-label">現在のサイト</span>
          <span id="currentDomainName" class="domain-card-host">取得中...</span>
        </div>
        <span id="domainStatusPill" class="status-pill status-disabled">判定中</span>
      </div>
      <label class="domain-toggle-row">
        <span class="domain-toggle-text">このサイトで機能を有効化</span>
        <input type="checkbox" id="domainToggle">
        <span class="slider"></span>
      </label>
    </div>

    <!-- 有効ドメイン管理アコーディオン -->
    <div class="domain-manager-wrapper">
      <button type="button" id="domainManagerToggle" class="domain-manager-header-btn">
        <div class="domain-manager-title">
          <span>🌐 有効ドメインの管理</span>
          <span id="enabledDomainCount" class="count-badge">0</span>
        </div>
        <span id="domainManagerArrow" class="accordion-arrow">▼</span>
      </button>

      <div id="domainManagerContent" class="domain-manager-content domain-manager-collapsed">
        <div class="domain-input-group">
          <input type="text" id="manualDomainInput" placeholder="例: chatgpt.com" autocomplete="off">
          <button type="button" id="manualAddDomainBtn" class="add-btn">追加</button>
        </div>
        <div id="enabledDomainList" class="domain-list"></div>
      </div>
    </div>

    <!-- クリーニング詳細設定 -->
    <section class="section">
      <h2 class="section-title">クリーニング設定</h2>

      <label class="toggle-row">
        <div class="toggle-text">
          <span class="toggle-label">行番号の削除</span>
          <span class="toggle-sub">1 | , 1: , 01 など自動検出</span>
        </div>
        <input type="checkbox" id="removeLineNumbers" checked>
        <span class="slider"></span>
      </label>

      <label class="toggle-row">
        <div class="toggle-text">
          <span class="toggle-label">プロンプト記号の削除</span>
          <span class="toggle-sub">$ , > , # などのシェル記号</span>
        </div>
        <input type="checkbox" id="removePromptPrefixes" checked>
        <span class="slider"></span>
      </label>

      <label class="toggle-row">
        <div class="toggle-text">
          <span class="toggle-label">フローティングコピーボタン</span>
          <span class="toggle-sub">選択時に [行番号なしコピー] を表示</span>
        </div>
        <input type="checkbox" id="showFloatingButton" checked>
        <span class="slider"></span>
      </label>

      <label class="toggle-row">
        <div class="toggle-text">
          <span class="toggle-label">Ctrl+C キャプチャ優先</span>
          <span class="toggle-sub">Copilot等のCtrl+C禁止環境を突破</span>
        </div>
        <input type="checkbox" id="interceptCtrlC" checked>
        <span class="slider"></span>
      </label>
    </section>

    <footer class="footer">
      <span>右クリックメニューからも使用できます</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
