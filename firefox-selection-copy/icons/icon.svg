<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="firefoxSunset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7139"/>
      <stop offset="50%" stop-color="#e23367"/>
      <stop offset="100%" stop-color="#90248a"/>
    </linearGradient>
    <linearGradient id="clipboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>

  <!-- Background Shield/Rounded Icon -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#firefoxSunset)" />

  <!-- Clipboard Base -->
  <rect x="30" y="32" width="68" height="76" rx="8" fill="url(#clipboardGrad)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.25))" />
  
  <!-- Clipboard Clip -->
  <rect x="48" y="24" width="32" height="16" rx="4" fill="#374151" />
  <circle cx="64" cy="32" r="3" fill="#ffffff" />

  <!-- Code Lines on Clipboard (No Line Numbers!) -->
  <rect x="42" y="52" width="44" height="5" rx="2.5" fill="#3b82f6" />
  <rect x="42" y="64" width="36" height="5" rx="2.5" fill="#10b981" />
  <rect x="42" y="76" width="40" height="5" rx="2.5" fill="#8b5cf6" />
  <rect x="42" y="88" width="28" height="5" rx="2.5" fill="#f59e0b" />

  <!-- Small Scissors / Sparkle Badge -->
  <circle cx="94" cy="94" r="18" fill="#111827" stroke="#ffffff" stroke-width="2" />
  <text x="94" y="99" font-size="16" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-weight="bold">✓</text>
</svg>
